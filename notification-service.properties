server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3308/notification_service_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

eureka.client.service-url.defaultZone=http://naming-server:8761/eureka

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Notification consumers consume from these queues
notification.order.created.queue.name=notification.order.created.queue
notification.payment.completed.queue.name=notification.payment.completed.queue

# Amazon SES
spring.mail.host=email-smtp.us-east-1.amazonaws.com
spring.mail.port=587
spring.mail.username=${AWS_SES_SMTP_USERNAME}
spring.mail.password=${AWS_SES_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true